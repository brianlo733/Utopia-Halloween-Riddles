<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utopia Halloween Riddles</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Creepster&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0d0a14;
      color: #f3f4f6;
    }
    .font-halloween {
      font-family: 'Creepster', cursive;
    }
    .spooky-card {
      background: rgba(22, 17, 33, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(168, 85, 247, 0.2);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7);
    }
    .shake {
      animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }
    .spooky-glow-orange {
      box-shadow: 0 0 20px rgba(249, 115, 22, 0.25);
    }
  </style>
</head>
<body class="min-h-screen pb-16 antialiased selection:bg-purple-500 selection:text-white">

  <!-- Sticky Header & Progress Bar -->
  <header class="sticky top-0 z-50 bg-[#0d0a14]/90 backdrop-blur-md border-b border-purple-900/40 px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <img id="headerLogo" src="SU image.jpg" alt="Utopia Logo" class="w-8 h-8 rounded-full object-cover border border-purple-500/50 shadow-sm shrink-0" onerror="this.src='https://via.placeholder.com/100/111827/a855f7?text=Utopia'">
        <span class="font-bold text-sm xs:text-base tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-orange-400 to-amber-300">
          Utopia Halloween Riddles
        </span>
      </div>

      <!-- Language Selector & Reset -->
      <div class="flex items-center gap-1.5">
        <button onclick="resetProgress()" title="重設進度" class="bg-purple-950/60 hover:bg-rose-950/80 text-purple-300 hover:text-rose-400 p-1.5 rounded-lg border border-purple-800/40 text-xs transition">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
        <div class="flex items-center gap-1 bg-purple-950/60 p-1 rounded-lg border border-purple-800/40 text-xs shrink-0">
          <button onclick="setLanguage('en')" id="btn-en" class="px-1.5 py-0.5 rounded font-medium transition">EN</button>
          <button onclick="setLanguage('zh-HK')" id="btn-zh-HK" class="px-1.5 py-0.5 rounded font-medium transition">繁</button>
          <button onclick="setLanguage('zh-CN')" id="btn-zh-CN" class="px-1.5 py-0.5 rounded font-medium transition">简</button>
        </div>
      </div>
    </div>

    <!-- Progress Indicator -->
    <div class="max-w-md mx-auto mt-2.5">
      <div class="flex justify-between items-center text-xs text-purple-300 mb-1 font-medium">
        <span id="txt-progress-label">解謎挑戰進度</span>
        <span id="progressText" class="font-bold text-orange-400">0 / 9</span>
      </div>
      <div class="w-full bg-purple-950/80 rounded-full h-2 overflow-hidden p-0.5 border border-purple-800/30">
        <div id="progressBar" class="bg-gradient-to-r from-purple-600 via-orange-500 to-amber-400 h-full rounded-full transition-all duration-500 w-0"></div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto px-4 pt-6 space-y-6">

    <!-- Hero / Welcome Banner -->
    <div class="spooky-card rounded-2xl p-6 text-center relative overflow-hidden border border-purple-500/30">
      <div class="absolute -top-12 -right-12 w-32 h-32 bg-purple-600/10 rounded-full blur-2xl"></div>
      <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-orange-600/10 rounded-full blur-2xl"></div>
      
      <img src="SU image.jpg" alt="Utopia Logo" class="w-20 h-20 mx-auto rounded-full object-cover border-2 border-purple-400/60 shadow-lg mb-3" onerror="this.src='https://via.placeholder.com/100/111827/a855f7?text=Utopia'">

      <h1 class="text-xl font-bold text-white mb-2 flex items-center justify-center gap-1.5">
        <span class="text-orange-400">🎃</span>
        <span>Welcome to Utopia Halloween Riddles</span>
        <span class="text-orange-400">🎃</span>
      </h1>
      <p id="txt-welcome-sub" class="text-xs text-purple-300/80 leading-relaxed max-w-xs mx-auto">
        解開全部 9 條萬聖節謎語，解鎖專屬通關 Code！進度會自動儲存。
      </p>
    </div>

    <!-- Riddles List Container -->
    <div id="riddlesContainer" class="space-y-5">
      <!-- Cards rendered dynamically via JS -->
    </div>

    <!-- Final Secret Card (Unlocked when all answered) -->
    <div id="secretCard" class="hidden spooky-card spooky-glow-orange rounded-2xl p-6 text-center border-2 border-orange-500/60 relative overflow-hidden transition-all duration-700">
      <div class="w-16 h-16 bg-gradient-to-br from-orange-500 to-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg text-2xl text-black">
        <i class="fa-solid fa-trophy"></i>
      </div>
      
      <h2 id="txt-congrats-title" class="text-xl font-extrabold text-white mb-1">
        🎉 恭喜通關！
      </h2>
      <p id="txt-congrats-sub" class="text-xs text-purple-200 mb-4">
        你已經成功解開所有萬聖節謎語！以下係你嘅專屬通關 Code：
      </p>

      <!-- 專屬 Code 展示區 -->
      <div class="bg-black/60 border border-orange-500/40 rounded-xl p-4 mb-4">
        <span class="text-xs text-orange-400 block mb-1 font-semibold tracking-wider uppercase" id="txt-code-label">你的專屬通關 Code</span>
        <div id="playerCodeDisplay" class="text-sm xs:text-base font-extrabold text-amber-300 tracking-wider font-mono select-all break-all">
          Generating...
        </div>
      </div>

      <!-- 玩家輸入名字與一鍵登記區 -->
      <div class="bg-purple-950/60 border border-orange-500/50 rounded-xl p-4 mb-4 text-left shadow-lg">
        <div class="flex items-start gap-2 mb-2">
          <i class="fa-solid fa-triangle-exclamation text-amber-400 text-sm mt-0.5 shrink-0"></i>
          <p id="txt-register-notice" class="text-xs font-bold text-amber-300 leading-snug">
            ⚠️ 必須填寫名字/IG並按「登記存檔」，通關紀錄才會發送至系統作實！
          </p>
        </div>

        <label class="block text-xs font-semibold text-purple-200 mb-1.5" id="txt-name-label">
          請輸入名字或 IG：
        </label>
        <div class="flex gap-2">
          <input type="text" id="playerNameInput" placeholder="寫名或寫 IG" 
            class="flex-1 bg-black/60 border border-purple-800/60 rounded-xl px-3 py-2 text-xs text-white placeholder-purple-400/50 focus:outline-none focus:border-orange-500"
          >
          <button onclick="submitPlayerRecord()" id="submitRecordBtn" class="bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-black font-extrabold px-3.5 py-2 rounded-xl text-xs transition shadow-md shrink-0">
            登記存檔
          </button>
        </div>
        <p id="saveStatus" class="text-xs text-emerald-400 mt-2 text-center hidden font-bold">
          ✓ 成功登記！請截圖此畫面作通關憑證！
        </p>
      </div>

      <button onclick="copyPlayerCode()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold py-2.5 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-xs">
        <i class="fa-solid fa-copy"></i>
        <span id="btn-copy-txt">複製專屬 Code</span>
      </button>
      
      <p id="copyToast" class="text-xs text-emerald-400 mt-2 opacity-0 transition-opacity duration-300 font-medium">
        ✓ 專屬 Code 已成功複製！
      </p>
    </div>

  </main>

  <!-- JavaScript Logic -->
  <script>
    // ⚠️ 請換成你部署好嘅 Google Apps Script Web App URL
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzJP2LDDAeFdUUEVBCdXcYbG7WFl-hPpjQ7ocNDZllj5ZII6ifsLQ9HLmNojVfmKPyb/exec";

    const i18n = {
      'en': {
        progressLabel: 'Challenge Progress',
        welcomeSub: 'Solve all 9 spooky Halloween riddles to unlock your unique clearance Code! Progress auto-saves.',
        submitBtn: 'Submit Answer',
        solvedBadge: 'SOLVED',
        wrongMsg: 'Incorrect answer. Try again!',
        congratsTitle: '🎉 Congratulations!',
        congratsSub: 'You solved all riddles! Here is your unique clearance Code:',
        codeLabel: 'Your Unique Clearance Code',
        registerNotice: '⚠️ You MUST enter your name/IG and click "Save Record" to submit your clearance data!',
        nameLabel: 'Enter Name or IG:',
        namePlaceholder: 'Enter name or IG',
        registerBtn: 'Save Record',
        copyBtn: 'Copy Unique Code',
        copiedToast: '✓ Code copied to clipboard!'
      },
      'zh-HK': {
        progressLabel: '解謎挑戰進度',
        welcomeSub: '解開全部 9 條萬聖節謎語，解鎖專屬通關 Code！進度會自動儲存。',
        submitBtn: '提交答案',
        solvedBadge: '已解答',
        wrongMsg: '答案唔正確，再試試！',
        congratsTitle: '🎉 恭喜通關！',
        congratsSub: '你已經成功解開所有萬聖節謎語！以下係你嘅專屬通關 Code：',
        codeLabel: '你的專屬通關 Code',
        registerNotice: '⚠️ 必須填寫名字/IG並按「登記存檔」，通關紀錄才會發送至系統作實！',
        nameLabel: '請輸入名字或 IG：',
        namePlaceholder: '寫名或寫 IG',
        registerBtn: '登記存檔',
        copyBtn: '複製專屬 Code',
        copiedToast: '✓ 專屬 Code 已成功複製！'
      },
      'zh-CN': {
        progressLabel: '解谜挑战进度',
        welcomeSub: '解开全部 9 条万圣节谜语，解锁专属通关 Code！进度会自动保存。',
        submitBtn: '提交答案',
        solvedBadge: '已解答',
        wrongMsg: '答案不正确，再试一次吧！',
        congratsTitle: '🎉 恭喜通关！',
        congratsSub: '你已经成功解开所有万圣节谜语！以下是你的专属通关 Code：',
        codeLabel: '你的专属通关 Code',
        registerNotice: '⚠️ 必须填写名字/IG并按“登记存档”，通关纪录才会发送至系统作实！',
        nameLabel: '请输入名字或 IG：',
        namePlaceholder: '写名或写 IG',
        registerBtn: '登记存档',
        copyBtn: '复制专属 Code',
        copiedToast: '✓ 专属 Code 已成功复制！'
      }
    };

    let currentLang = 'zh-HK';
    let generatedPlayerId = "";
    let isRegistered = false;

    // 9 條萬聖節謎語資料庫
    const riddles = [
      { id: 1, question: "Who Is That Charming Hag?", answers: ["witch"], lengthHint: "5 Letters" },
      { id: 2, question: "My mother makes sure to wrap me in the finest cloths.", answers: ["mummy"], lengthHint: "5 Letters" },
      { id: 3, question: "Brr brr brr brr brr brr brr brr... it's so cold!", answers: ["october"], lengthHint: "7 Letters" },
      { id: 4, question: "Wow, The Sin must've been worth the poisoned apple.", answers: ["snow white", "snowwhite", "snow-white"], lengthHint: "4, 5 Letters" },
      { id: 5, question: "Position me right... or left. Never middle. Drink me... or don't. It's never simple.", answers: ["potion"], lengthHint: "6 Letters" },
      { id: 6, question: "Dracula is great at hacking! Spreading viruses from the comfort of his own bed.", answers: ["coffin"], lengthHint: "6 Letters" },
      { id: 7, question: "Seeing the knight's head cut off, beside him his trusty steed, I will not sleep soundly tonight.", answers: ["nightmare"], lengthHint: "9 Letters" },
      { id: 8, question: "I steal behind my stern mom's back. Rotten egg, that's what I am.", answers: ["monster"], lengthHint: "7 Letters" },
      { id: 9, question: "Not leeks. Mixed them up with a frame of sorts.", answers: ["skeleton"], lengthHint: "8 Letters" }
    ];

    let solvedState = {};

    // 頁面載入時：從 LocalStorage 讀取已儲存嘅進度
    function loadProgress() {
      try {
        const savedSolved = localStorage.getItem('utopia_solved_state');
        if (savedSolved) {
          solvedState = JSON.parse(savedSolved);
        }
        const savedCode = localStorage.getItem('utopia_player_id');
        if (savedCode) {
          generatedPlayerId = savedCode;
        }
        const savedReg = localStorage.getItem('utopia_is_registered');
        if (savedReg === 'true') {
          isRegistered = true;
        }
      } catch (e) {
        console.error("Load progress error:", e);
      }
    }

    // 儲存進度至 LocalStorage
    function saveProgress() {
      try {
        localStorage.setItem('utopia_solved_state', JSON.stringify(solvedState));
        if (generatedPlayerId) {
          localStorage.setItem('utopia_player_id', generatedPlayerId);
        }
        localStorage.setItem('utopia_is_registered', isRegistered ? 'true' : 'false');
      } catch (e) {
        console.error("Save progress error:", e);
      }
    }

    // 重設進度功能
    function resetProgress() {
      if (confirm("確定要重設所有解謎進度重新開始嗎？")) {
        localStorage.removeItem('utopia_solved_state');
        localStorage.removeItem('utopia_player_id');
        localStorage.removeItem('utopia_is_registered');
        location.reload();
      }
    }

    function setLanguage(lang) {
      currentLang = lang;
      
      ['en', 'zh-HK', 'zh-CN'].forEach(l => {
        const btn = document.getElementById(`btn-${l}`);
        btn.className = (l === lang)
          ? 'px-1.5 py-0.5 rounded font-medium transition bg-orange-500 text-black font-bold'
          : 'px-1.5 py-0.5 rounded font-medium transition text-purple-300 hover:text-white';
      });

      const dict = i18n[lang];
      document.getElementById('txt-progress-label').innerText = dict.progressLabel;
      document.getElementById('txt-welcome-sub').innerText = dict.welcomeSub;
      document.getElementById('txt-congrats-title').innerText = dict.congratsTitle;
      document.getElementById('txt-congrats-sub').innerText = dict.congratsSub;
      document.getElementById('txt-code-label').innerText = dict.codeLabel;
      document.getElementById('txt-register-notice').innerText = dict.registerNotice;
      document.getElementById('txt-name-label').innerText = dict.nameLabel;
      document.getElementById('playerNameInput').placeholder = dict.namePlaceholder;
      document.getElementById('submitRecordBtn').innerText = dict.registerBtn;
      document.getElementById('btn-copy-txt').innerText = dict.copyBtn;
      document.getElementById('copyToast').innerText = dict.copiedToast;

      renderRiddles();
    }

    function renderRiddles() {
      const container = document.getElementById('riddlesContainer');
      const dict = i18n[currentLang];
      
      container.innerHTML = riddles.map((r, index) => {
        const isSolved = solvedState[r.id];
        return `
          <div id="card-${r.id}" class="spooky-card rounded-2xl p-5 border transition-all duration-300 ${isSolved ? 'border-emerald-500/50 bg-emerald-950/20' : 'border-purple-800/40'}">
            <div class="flex items-center justify-between mb-3">
              <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-purple-900/60 text-purple-300 border border-purple-700/50">
                # ${index + 1}
              </span>
              <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-orange-950/60 text-orange-400 border border-orange-800/40">
                <i class="fa-solid fa-font mr-1"></i> ${r.lengthHint}
              </span>
            </div>

            <p class="text-base font-semibold text-purple-100 mb-4 leading-snug">
              "${r.question}"
            </p>

            ${isSolved ? `
              <div class="bg-emerald-900/30 border border-emerald-500/40 rounded-xl p-3 flex items-center justify-between">
                <span class="text-emerald-400 text-xs font-semibold flex items-center gap-1.5">
                  <i class="fa-solid fa-circle-check text-sm"></i> ${dict.solvedBadge}
                </span>
                <span class="text-emerald-300 font-mono text-sm font-bold capitalize">${r.answers[0]}</span>
              </div>
            ` : `
              <div class="space-y-3">
                <div>
                  <input type="text" id="input-${r.id}" placeholder="${r.lengthHint}" 
                    class="w-full bg-black/50 border border-purple-800/60 rounded-xl px-4 py-2.5 text-sm text-white placeholder-purple-400/50 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition"
                    onkeypress="if(event.key==='Enter') checkAnswer(${r.id})"
                  >
                  <p id="err-${r.id}" class="text-xs text-rose-400 mt-1.5 hidden flex items-center gap-1">
                    <i class="fa-solid fa-triangle-exclamation"></i> ${dict.wrongMsg}
                  </p>
                </div>

                <div class="flex justify-end pt-1">
                  <button onclick="checkAnswer(${r.id})" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white text-xs font-bold py-2.5 px-5 rounded-xl transition shadow-md flex items-center gap-1.5">
                    <span>${dict.submitBtn}</span>
                    <i class="fa-solid fa-arrow-right"></i>
                  </button>
                </div>
              </div>
            `}
          </div>
        `;
      }).join('');
    }

    function checkAnswer(id) {
      const inputEl = document.getElementById(`input-${id}`);
      const errEl = document.getElementById(`err-${id}`);
      const cardEl = document.getElementById(`card-${id}`);

      const userAns = inputEl.value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
      const riddle = riddles.find(r => r.id === id);

      const isCorrect = riddle.answers.some(ans => {
        const cleanAns = ans.toLowerCase().replace(/[^a-z0-9]/g, '');
        return cleanAns === userAns;
      });

      if (isCorrect) {
        solvedState[id] = true;
        errEl.classList.add('hidden');
        saveProgress(); // 答對即刻自動儲存
        updateProgress();
        renderRiddles();
      } else {
        errEl.classList.remove('hidden');
        cardEl.classList.remove('shake');
        void cardEl.offsetWidth;
        cardEl.classList.add('shake');
      }
    }

    function updateProgress() {
      const solvedCount = Object.keys(solvedState).length;
      const total = riddles.length;
      const percent = (solvedCount / total) * 100;

      document.getElementById('progressText').innerText = `${solvedCount} / ${total}`;
      document.getElementById('progressBar').style.width = `${percent}%`;

      if (solvedCount === total) {
        triggerWin();
      }
    }

    function generateUniqueCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let result = '';
      for (let i = 0; i < 12; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return `#UTOPIA-HW-${result}`;
    }

    function triggerWin() {
      if (!generatedPlayerId) {
        generatedPlayerId = generateUniqueCode();
        saveProgress();
      }
      
      document.getElementById('playerCodeDisplay').innerText = generatedPlayerId;

      if (isRegistered) {
        const btn = document.getElementById('submitRecordBtn');
        btn.disabled = true;
        btn.innerText = '已登記';
        btn.classList.remove('from-orange-500', 'to-amber-500');
        btn.classList.add('bg-emerald-600', 'text-white');
        document.getElementById('saveStatus').classList.remove('hidden');
      }

      const secretCard = document.getElementById('secretCard');
      secretCard.classList.remove('hidden');
      
      setTimeout(() => {
        secretCard.scrollIntoView({ behavior: 'smooth' });
      }, 300);

      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.6 },
        colors: ['#a855f7', '#f97316', '#eab308', '#22c55e']
      });
    }

    function submitPlayerRecord() {
      const nameInput = document.getElementById('playerNameInput').value.trim();
      if (!nameInput) {
        alert('請輸入名字或 IG 先！');
        return;
      }

      if (isRegistered) {
        alert('你已經完成登記記錄喇！');
        return;
      }

      const btn = document.getElementById('submitRecordBtn');
      btn.disabled = true;
      btn.innerText = '登記中...';

      if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL === "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE") {
        alert('提示：未設定 Google Apps Script URL，暫時無法寫入雲端試算表。');
        btn.disabled = false;
        return;
      }

      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          playerId: generatedPlayerId, 
          playerName: nameInput 
        })
      }).then(() => {
        isRegistered = true;
        saveProgress();
        btn.innerText = '已登記';
        btn.classList.remove('from-orange-500', 'to-amber-500');
        btn.classList.add('bg-emerald-600', 'text-white');
        document.getElementById('saveStatus').classList.remove('hidden');
      }).catch(err => {
        console.error("Save error:", err);
        alert('登記失敗，請重試！');
        btn.disabled = false;
        btn.innerText = '登記存檔';
      });
    }

    function copyPlayerCode() {
      if (!generatedPlayerId) return;
      navigator.clipboard.writeText(generatedPlayerId).then(() => {
        const toast = document.getElementById('copyToast');
        toast.classList.remove('opacity-0');
        setTimeout(() => {
          toast.classList.add('opacity-0');
        }, 2000);
      });
    }

    // 初始化：載入舊進度、渲染頁面、更新進度條
    loadProgress();
    setLanguage('zh-HK');
    updateProgress();
    if (Object.keys(solvedState).length === riddles.length) {
      triggerWin();
    }
  </script>
</body>
</html>
